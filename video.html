<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1020">
  <meta name="robots" content="noindex">
  <title>视频播放</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #25304f, #0d1020 60%); color: #f8fafc; }
    main { width: min(920px, 100%); }
    h1 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 42px); }
    p { margin: 0 0 20px; color: #cbd5e1; }
    .card { overflow: hidden; border: 1px solid #475569; border-radius: 22px; background: rgba(15, 23, 42, .8); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
    video { display: block; width: 100%; max-height: 74vh; background: #000; }
    .actions { display: flex; align-items: center; gap: 14px; padding: 18px; }
    button { border: 0; border-radius: 999px; padding: 12px 20px; color: #111827; background: #fbbf24; font-size: 16px; font-weight: 700; cursor: pointer; }
    .hint { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>视频播放</h1>
    <p>点击播放按钮即可观看。</p>
    <section class="card">
      <video id="player" controls playsinline preload="metadata">
        <source src="./video/3f59fe0272e411963217a188acb259fa.mp4" type="video/mp4">
        你的浏览器不支持视频播放。
      </video>
      <div class="actions">
        <button id="play" type="button">▶ 播放视频</button>
        <span class="hint">支持手机横屏观看</span>
      </div>
    </section>
  </main>
  <script>
    const player = document.getElementById('player');
    const play = document.getElementById('play');
    play.addEventListener('click', async () => {
      if (player.paused) { await player.play(); } else { player.pause(); }
    });
    player.addEventListener('play', () => { play.textContent = '❚❚ 暂停视频'; });
    player.addEventListener('pause', () => { play.textContent = '▶ 播放视频'; });
  </script>
</body>
</html>
